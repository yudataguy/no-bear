[package]
name = "drone_flight_core"
version = "0.1.0"
edition = "2021"
authors = ["Drone Flight Core Team"]
description = "Performance-critical components for drone flight software"
license = "MIT"

[lib]
name = "drone_flight_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
numpy = "0.20"
nalgebra = "0.32"
tokio = { version = "1.34", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "vision_benchmarks"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
